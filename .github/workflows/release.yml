name: Release desktop app

# Push a vX.Y.Z tag to build installers and open a draft GitHub release.
# Secrets: GOOGLE_DESKTOP_CLIENT_ID and GOOGLE_DESKTOP_CLIENT_SECRET (required);
# CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_ID_PASS and APPLE_TEAM_ID sign and
# notarize the macOS build when present.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac --arm64
          - os: windows-latest
            platform: --win --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check tag matches app version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in package.json release/app/package.json; do
            actual=$(node -p "require('./$file').version")
            if [ "$actual" != "$version" ]; then
              echo "::error::$file is $actual but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test -- --runInBand
      - name: Package
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASS: ${{ secrets.APPLE_ID_PASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=(${{ matrix.platform }})
          if [ "$RUNNER_OS" = macOS ] && [ -z "$CSC_LINK" ]; then
            echo "::warning::No signing certificate; building an ad-hoc signed macOS app."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            args+=(--config.mac.identity=- --config.mac.hardenedRuntime=false)
          fi
          npm run package -- "${args[@]}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: installers-${{ runner.os }}
          path: |
            release/build/*.dmg
            release/build/*.zip
            release/build/*.exe
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft \
            "${prerelease[@]}"
